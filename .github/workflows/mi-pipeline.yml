name: Mi Primer Pipeline CI/CD

# 1. DISPARADOR (Trigger): Define cuándo se ejecuta el pipeline
on:
  push:
    branches: [ "main" ] # Se ejecuta cuando envías código a la rama main
  pull_request:
    branches: [ "main" ] # Se ejecuta al abrir una Pull Request a main

# 2. JOBS: Las tareas independientes a realizar
jobs:
  construir-y-probar:
    # Sistema operativo virtual donde se ejecutará
    runs-on: ubuntu-latest

    # Pasos que ejecutará en secuencia
    steps:
      # Paso 1: Descarga el código del repositorio a la máquina virtual
      - name: Descargar el código
        uses: actions/checkout@v4

      # Paso 2: Simular instalación de dependencias o configuración
      - name: Configurar entorno
        run: echo "Configurando el entorno de prueba..."

      # Paso 3: Simular ejecución de pruebas automáticas
      - name: Ejecutar pruebas unitarias
        run: |
          echo "Corriendo pruebas..."
          echo "¡Todas las pruebas pasaron correctamente!"

      # Paso 4: Simular el despliegue
      - name: Desplegar aplicación
        run: echo "Desplegando la aplicación en producción..."
